<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topo">
  <div class="topo-conteudo">
    <div class="marca" id="marca"></div>
    <div class="titulo-central">
      <span class="eyebrow">Cardápio</span>
      <h1 id="nome-restaurante"></h1>
      <p id="subtitulo-restaurante"></p>
    </div>
    <div></div>
  </div>
</header>

<nav class="nav-categorias">
  <div class="nav-categorias-lista" id="nav-lista"></div>
</nav>

<main id="menu-conteudo"></main>

<footer>
  <div class="rodape-conteudo">
    <div class="rodape-mapa" id="rodape-mapa"></div>
    <div class="rodape-info">
      <h3 id="rodape-nome"></h3>
      <p id="rodape-endereco"></p>
      <p id="rodape-horario"></p>
      <div class="rodape-social" id="rodape-social"></div>
    </div>
  </div>
  <div class="rodape-base" id="rodape-base"></div>
</footer>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/render.js"></script>
</body>
</html>
